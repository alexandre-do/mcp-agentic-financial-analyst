[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "Agentic Data Analyst template for AI-powered analytics workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.4",
    "streamlit>=1.33.0",
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "sqlalchemy>=2.0.29",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    "plotly>=5.9.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
