[project]
name = "mcp-agentic-financial-analyst"
version = "0.1.0"
description = "MCP-powered agentic financial analyst for AI-powered analytics workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.4",
    "streamlit>=1.33.0",
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "sqlalchemy>=2.0.29",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    "plotly>=5.9.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.2.0",
    "langgraph>=1.2.11",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
    "dotenv>=0.9.9",
    "langchainhub>=0.1.21",
    "langchain-anthropic>=1.5.6",
    "python-docx>=1.2.0",
    "langsmith>=0.11.0",
    "deepagents>=0.7.7",
    "pypdf>=6.16.1",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.uv]
package = false
